name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.18'
      - run: python -m pip install uv==0.13.9
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check . ../scripts/smoke_runs.py ../scripts/smoke_analysis.py ../scripts/build_google_ads_batch.py && uv run ruff format --check . ../scripts/smoke_runs.py ../scripts/smoke_analysis.py ../scripts/build_google_ads_batch.py && uv run mypy
        working-directory: backend
      - run: MYPYPATH=src uv run mypy ../scripts/build_google_ads_batch.py
        working-directory: backend
      - name: Isolated PostgreSQL integration and API tests
        run: |
          python scripts/init_local_env.py
          docker compose --env-file .env -f infrastructure/compose.yaml config --quiet
          docker compose --env-file .env -f infrastructure/compose.yaml --profile test run --build --rm tests
      - name: Live API and idempotent bootstrap smoke test
        run: |
          docker compose --env-file .env -f infrastructure/compose.yaml up --build --wait api
          curl --fail http://127.0.0.1:8000/api/v1/health
          curl --fail http://127.0.0.1:8000/api/v1/ready
          docker compose --env-file .env -f infrastructure/compose.yaml exec -T api python -m paw.cli bootstrap
          docker compose --env-file .env -f infrastructure/compose.yaml exec -T api python -m paw.cli bootstrap
          count=$(docker compose --env-file .env -f infrastructure/compose.yaml exec -T postgres psql -U paw -d paw -Atc 'SELECT count(*) FROM system_events;')
          test "$count" = 3
      - name: Live diagnostic Worker smoke test
        run: |
          docker compose --env-file .env -f infrastructure/compose.yaml up --build -d worker
          python scripts/smoke_runs.py
          python scripts/smoke_analysis.py
      - name: Stop CI services
        if: always()
        run: docker compose --env-file .env -f infrastructure/compose.yaml --profile test stop

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run typecheck && npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks 8.30.1 (single secret scan)
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          /tmp/gitleaks-bin/gitleaks git --redact --no-banner --log-opts='--all' .
