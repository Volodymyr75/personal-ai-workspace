name: paw-local-ai

services:
  ollama:
    image: ollama/ollama@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
    cpus: 6
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ollama_models:
