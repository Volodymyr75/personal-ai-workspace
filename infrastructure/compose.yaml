name: paw

x-backend-env: &backend-env
  PAW_DB_HOST: postgres
  PAW_DB_NAME: paw
  PAW_DB_USER: paw
  PAW_DB_PASSWORD: ${PAW_DB_PASSWORD:?Set PAW_DB_PASSWORD in .env}
  PAW_API_URL: http://api:8000

services:
  postgres:
    image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      POSTGRES_DB: paw
      POSTGRES_USER: paw
      POSTGRES_PASSWORD: ${PAW_DB_PASSWORD:?Set PAW_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paw -d paw']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: ../backend
      target: base
    environment: *backend-env
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    build:
      context: ../backend
      target: base
    environment: *backend-env
    volumes: ["file_data:/data/files"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend, outbound]

  web:
    build:
      context: ../frontend
    ports: ["127.0.0.1:3000:3000"]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.6@sha256:eafe48609be09a2d56dd3628b29932a12c2e81a06ac5a309205652ea36146619
    profiles: [automation]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-}
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
    ports: ["127.0.0.1:5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n"]
    networks: [backend, outbound]

  postgres-test:
    image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    profiles: [test]
    environment:
      POSTGRES_DB: paw_test
      POSTGRES_USER: paw_test
      POSTGRES_PASSWORD: ${PAW_DB_PASSWORD:?Set PAW_DB_PASSWORD in .env}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paw_test -d paw_test']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [testing]

  tests:
    build:
      context: ../backend
      target: test
    profiles: [test]
    environment:
      PAW_TEST_DATABASE_URL: postgresql+psycopg://paw_test:${PAW_DB_PASSWORD}@postgres-test/paw_test
    depends_on:
      postgres-test:
        condition: service_healthy
    networks: [testing]

volumes:
  file_data:
  postgres_data:
  n8n_data:

networks:
  backend:
    internal: true
  testing:
    internal: true
  outbound:
